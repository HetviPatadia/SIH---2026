version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mplads_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/mplads_db
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    depends_on:
      - postgres
      - redis
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports

  postgres:
    image: postgis/postgis:15-3.3
    container_name: mplads_postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mplads_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mplads_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:

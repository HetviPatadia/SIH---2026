<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MPLADS AI Audit Intelligence - UI Design Concepts</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    h1 { font-size: 28px; font-weight: 700; color: #ffffff; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 15px; margin-bottom: 30px; }
    .card {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 40px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .card h2 { font-size: 20px; color: #38bdf8; margin-top: 0; margin-bottom: 12px; }
    img { width: 100%; height: auto; border-radius: 8px; border: 1px solid #1e293b; display: block; }
    .badge {
      display: inline-block;
      background: #1e293b;
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <h1>MPLADS AI Audit Intelligence System — UI Mockups</h1>
  <p>Institutional Dark-Mode Concept Visualizations based on SIH26102 specifications.</p>

  <div class="card">
    <h2>1. Executive Dashboard (Main Audit Overview)</h2>
    <div class="badge">dashboard_concept.jpg</div>
    <img src="dashboard_concept.jpg" alt="Executive Dashboard Concept">
  </div>

  <div class="card">
    <h2>2. Evidence Forensic Comparison Workspace</h2>
    <div class="badge">evidence_comparison_concept.jpg</div>
    <img src="evidence_comparison_concept.jpg" alt="Evidence Comparison Workspace Concept">
  </div>
</body>
</html>
